name: CI

# The deterministic guard for tally-up: build, vet, and the Go tests that need
# no database, on every pull request and every push to main.
#
# This is deliberately a different role from claude-review.yaml. That reviewer
# is advisory, comment-triggered, and applies judgement; this check is
# mechanical, automatic, and blocking. Neither substitutes for the other.
#
# SCOPE: DB-backed tests do not run here yet — see the Test step. That is a
# deliberate staging decision, not an oversight.
#
# Operator setup: make `test` a required status check for `main`
# (Settings -> Branches -> branch protection). Until that is done this workflow
# reports but does not gate.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer push to the same ref supersedes the run already in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this workflow only ever reads the tree.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Third-party actions are pinned to commit SHAs, not tags. A tag is mutable:
    # whoever controls the repo can repoint v7 at new code, which would then run
    # here with access to this job. The trailing comment is the human-readable
    # version — update both together.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # Delegated to the Makefile so the test invocation has exactly one
      # definition and cannot drift from what contributors run locally.
      #
      # DATABASE_URL is deliberately empty: with no TEST_DATABASE_URL, the
      # DB-backed tests skip (see decideDBURL in
      # internal/infrastructure/postgres/store.go) and what runs here is the
      # domain and pure-logic coverage. Turning the database on is a follow-up:
      # add a `services: postgres` block, point DATABASE_URL at it, and set
      # TALLYUP_REQUIRE_DB=1 so a mis-wired database fails the job instead of
      # silently skipping every integration test.
      - name: Test (no database)
        run: make test DATABASE_URL=
