name: CI

# The deterministic guard for tally-up: two jobs, `test` (build, vet, and the
# full Go suite, including the tests that need Postgres) and `web` (lint,
# build, and test the Next.js client), on every pull request and every push
# to main.
#
# This is deliberately a different role from claude-review.yaml. That reviewer
# is advisory, comment-triggered, and applies judgement; this check is
# mechanical, automatic, and blocking. Neither substitutes for the other.
#
# Operator setup: make `test` (and, per #96, `web`) a required status check
# for `main` (Settings -> Branches -> branch protection). Until that is done
# this workflow reports but does not gate.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer push to the same ref supersedes the run already in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this workflow only ever reads the tree.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Mirrors docker-compose.yml's `db` service — same image, user, password,
    # and database name. Only the port differs: 5432 here (the container's
    # default, mapped straight through) vs. 5433 locally (chosen so the
    # compose service doesn't collide with a developer's own Postgres).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tallyup
          POSTGRES_PASSWORD: tallyup
          POSTGRES_DB: tallyup_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Third-party actions are pinned to commit SHAs, not tags. A tag is mutable:
    # whoever controls the repo can repoint v7 at new code, which would then run
    # here with access to this job. The trailing comment is the human-readable
    # version — update both together.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: sqlc-dev/setup-sqlc@bac53b7fb28c039a6c7f5736fd1e89744021bdd6 # v5.0.0
        with:
          sqlc-version: "1.30.0"

      # Follow-up to #94: a query/*.sql edit that skips `make sqlc` would
      # otherwise build clean against stale generated code and silently not
      # take effect. Runs before setup-go since it needs no Go toolchain, and
      # is delegated to the Makefile so the check has one definition (same
      # reasoning as the Test step below). The pinned sqlc-version above must
      # track sqlc.yaml's local generator output (see docs/development.md) —
      # bump both together, or an unrelated sqlc release turns this red on
      # an unrelated PR.
      - name: sqlc up to date
        run: make sqlc-check

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # Linter set decided in #98 (config: .golangci.yaml). golangci-lint's
      # own version is pinned to match the Makefile's `lint` target, so a new
      # release can't turn this job red on an unrelated PR.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.6.2

      # Delegated to the Makefile so the test invocation has exactly one
      # definition and cannot drift from what contributors run locally.
      #
      # TALLYUP_REQUIRE_DB is the part that matters: without it, a typo in
      # DATABASE_URL would silently return this job to skipping every
      # DB-backed test while still reporting green — the failure mode
      # `decideDBURL` (internal/infrastructure/postgres/postgrestest) exists
      # to prevent. With it, the same typo fails the job loudly.
      - name: Test
        env:
          TALLYUP_REQUIRE_DB: "1"
        run: make test DATABASE_URL='postgres://tallyup:tallyup@localhost:5432/tallyup_test?sslmode=disable'

  # Follow-up to #94, which deliberately deferred this: `web/` had no
  # devDependency on vitest and zero test files, so wiring it in then would
  # have produced a permanently red required check. #88 landed real tests
  # (web/lib/split.test.ts) and #96 adds the missing vitest/jsdom deps, so
  # this job now has something real to run.
  #
  # Operator setup: as with the `test` job above, this reports but is not
  # yet a required status check for `main` — that's a deliberate open
  # decision for the maintainer (#96), not made here.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # Follow-up to #191: a spec/openapi.yaml change that skips
      # `npm run gen:api-types`/`gen:api-schemas` would otherwise leave
      # web/lib/api-types.ts and web/lib/api-schemas/ silently stale —
      # same class of gap `sqlc-check` closes for the Go side. Delegated
      # to the Makefile for one definition, so this step needs npm's
      # node_modules (already installed above) but runs from repo root.
      - name: Web API client up to date
        working-directory: ${{ github.workspace }}
        run: make web-api-check

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

      # Build-only: catches a broken story or Storybook config the same way
      # a broken `npm run build` would. Interaction/play-function tests run
      # separately below via addon-vitest (#226, ADR 0005) — kept alongside
      # this step rather than replacing it, since they catch different
      # failure modes.
      - name: Storybook build
        run: npm run build-storybook

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Advisory, like Storybook build above: runs play functions
      # (interaction tests) via @storybook/addon-vitest, a separate Vitest
      # project from the jsdom logic suite `npm test` runs — kept out of
      # `npm test` on purpose. See docs/adr/0005-storybook-interaction-tests.md.
      - name: Storybook interaction tests
        timeout-minutes: 5
        run: npm run test:storybook

      - name: Test
        run: npm test

  # The E2E tier (ADR 0006): Gherkin scenarios driven through a real browser
  # against the real stack — Next.js client, Go API, Postgres, nothing mocked.
  #
  # Its own job rather than a step in `web` because it is the only one needing
  # Go, Node, and a database together; adding a Go toolchain and a service
  # container to `web` would roughly double the runtime of every PR that only
  # touches client code.
  #
  # Advisory for now, the same way `storybook build` (#184) and the Storybook
  # interaction tests (ADR 0005) both entered — `continue-on-error` keeps a
  # flaky first-generation E2E suite from blocking merges, and this does not
  # preempt #96's open decision about which checks become required.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true

    # Same image/credentials as the `test` job above, for the same reason:
    # it mirrors docker-compose.yml, on 5432 rather than the local 5433.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tallyup
          POSTGRES_PASSWORD: tallyup
          POSTGRES_DB: tallyup_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      # Follow-up to #273: a .feature edit that skips regenerating
      # .features-gen/ would otherwise leave the committed Playwright specs
      # silently stale — same class of gap sqlc-check/web-api-check close
      # for the Go and API-client generators.
      - name: Generated Playwright specs up to date
        working-directory: ${{ github.workspace }}
        run: make features-gen-check

      # Pre-building the API means the `go run` inside Playwright's webServer
      # starts from a warm build cache and comes up well within its timeout,
      # instead of compiling the whole dependency tree while Playwright polls
      # /healthz.
      - name: Prebuild API
        run: go build ./cmd/api

      - name: Install Playwright browser
        working-directory: web
        run: npx playwright install --with-deps chromium

      # CI=true (set by Actions) switches the config to a production Next.js
      # build and enables one retry — see web/playwright.config.ts.
      - name: E2E
        working-directory: web
        env:
          E2E_DATABASE_URL: postgres://tallyup:tallyup@localhost:5432/tallyup_test?sslmode=disable
        run: npm run e2e

      - if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
