name: Spec drift

# Blocking check that spec/openapi.yaml is what spec/main.tsp actually compiles
# to. #93's contract only works if the committed OpenAPI is trustworthy: the Go
# server validates against it (openapi_spec_test.go) and the web client
# generates types from it, so a hand-edited or stale openapi.yaml would make
# both sides trust something the source no longer says. Scoped to spec/ only —
# self-contained, no Postgres or Go toolchain needed — so it does not depend on
# #94 (the Go build/vet/test workflow, not yet merged).

on:
  pull_request:
    paths:
      - "spec/**"
  push:
    branches: [main]
    paths:
      - "spec/**"

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: spec
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: spec/package-lock.json

      - run: npm ci

      - run: npm run build

      - name: Fail if the compiled spec differs from the committed one
        run: |
          if ! git diff --exit-code -- openapi.yaml; then
            echo "::error::spec/openapi.yaml is stale. Run \`make spec\` and commit the result."
            exit 1
          fi
